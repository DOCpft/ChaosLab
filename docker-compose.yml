version: "3.8"

services:
    pgdb:
        image: postgres:15.3-alpine
        container_name: chaos-pgdb
        environment:
            POSTGRES_USER: chaos
            POSTGRES_PASSWORD: chaos_password
            POSTGRES_DB: chaos_experiments_db
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
    redis:
        image: redis:7.0-alpine
        container_name: chaos-redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
    clickhouse:
        image: yandex/clickhouse-server:latest
        container_name: chaos-clickhouse
        environment:
            - CLICKHOUSE_DB=chaos_analytics_db
            - CLICKHOUSE_USER=chaos
            - CLICKHOUSE_PASSWORD=chaos_password
        ports:
            - "8123:8123"
            - "9000:9000"
        volumes:
            - clickhousedata:/var/lib/clickhouse
    rabbitmq:
        image: rabbitmq:4.2.5-management-alpine
        container_name: chaos-rabbitmq
        hostname: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
            - rabbitmqdata:/var/lib/rabbitmq
volumes:
    pgdata:
    redisdata:
    clickhousedata:
    rabbitmqdata:
